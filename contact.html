*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tahoma,sans-serif;background:var(--bg);color:var(--tx);line-height:1.8}
header{background:var(--br);color:#fff;position:sticky;top:0;z-index:5}
.bar{max-width:880px;margin:auto;padding:10px 22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px}
.logo{font-weight:900;font-size:1.3rem;color:#fff;text-decoration:none}
nav a{color:#E8DDD2;text-decoration:none;padding:6px 12px;border-radius:8px;font-weight:600;display:inline-block}
nav a.on,nav a:hover{background:var(--gr);color:#fff}
a:focus-visible{outline:3px solid #fff;outline-offset:2px}

.btn{display:inline-block;background:var(--gr);color:#fff;padding:12px 28px;border-radius:10px;font-weight:900;text-decoration:none}
.btn:focus-visible{outline-color:var(--br)}
.cup{max-width:260px;margin:32px 0 0}
.sv{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-bottom:28px}
.sv div{border:1px solid var(--ln);border-radius:14px;padding:20px;background:#fff}
.sv h3{color:var(--gr)}
dl{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;margin-bottom:22px}
dt{font-weight:900}
dd.l{direction:ltr;text-align:right}
footer{text-align:center;padding:28px;color:#7A6A5F;font-size:.9rem;border-top:1px solid var(--ln)}
